<!DOCTYPE html>
<html>
<head> 
	<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
	<link type="text/css" media="all" rel="stylesheet" href="/static/css/style_for_pages.css"> 
	<link type="text/css" media="all" rel="stylesheet" href="/static/css/style_for_Main1Page.css">
	<link rel="shortcut icon" href="/static/icons/emblem_1.ico">
	<script type="text/javascript" src="/static/js/upload_an_image.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="/static/js/delete_a_flash_message.js"></script>	
	<title> PLANT DISEASE AI DETECTION </title> 
	<meta http-equiv="Content-Language" content="uk"/>
</head>


<!-------------------------------------------------------------->
<body>

<div class="wrapper"> 

	<div class="title">	<a href="HomePage.html" 	class="crystal_clear_button"> PLANT DISEASE AI DETECTION  </a> </div>
	<div class="btn1"> 	<a href="Main1Page.html"   	class="crystal_clear_button btn">  MAIN </a> </div>
	<div class="btn2"> 	
		<div 	class="crystal_clear_button dropdown btn "> MORE &#9660;
			<div class="dropdown-content">
				<a href="HistoryPage.html" class="crystal_clear_button btn_2"> CASE HISTORY </a> 
				<a href="Treatment1Page.html" class="crystal_clear_button btn_2"> ADD TREATMENT </a> 
				<a href="Treatment2Page.html" class="crystal_clear_button btn_2"> TREATMENT HISTORY </a> 
				<a href="Statistics1Page.html" class="crystal_clear_button btn_2"> STATISTICS </a>
			</div>
		</div>
	</div>
	<div class="btn3"> 	<a href="AboutPage.html"   	class="crystal_clear_button btn"> ABOUT   </a> </div>

	<!-------------------------------------------------------------->
	
	<div class="PageBody">
		{% with errors = get_flashed_messages(category_filter=["warning"]) %}
			{% if errors %}
				{%- for message in errors %}
					<div class="flash_alert_warning">
						<span> <i>{{message}} </i></span>
						<button class="crystal_clear_button close_button" onclick="delete_a_flash_message_warning()" >
							<span>close</span>
						</button>
					</div>
					
				{% endfor %}
			{% endif %}
		{% endwith %}
		
	
		<div class="ViewImage"> <img alt="please, download an image" class="image_preview" id="my-image" /> </div>
		
		<form action="/Main1Page.html" method="POST" enctype="multipart/form-data">
			<div> 
				<label for="upload-photo" class="choose_a_photo_label"> CHOOSE A PHOTO</label>
				<input type="file" name="file" id="upload-photo" accept=".png, .jpg, .jpeg', .gif" onchange="previewImage(event)"/>
			</div>
			<div> 
				<button class="crystal_clear_button submit_button " type="submit">  ANALYZE </button> 
			</div>
		</form>
		
	</div>
	<!-------------------------------------------------------------->



</div>


</body>
</html>
